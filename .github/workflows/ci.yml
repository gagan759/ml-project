name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-train.txt pytest==9.2.0 httpx==0.28.1 ruff==0.14.6
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src backend tests streamlit_ui streamlit_app.py scripts/19_baseline_audit.py scripts/2*.py scripts/3*.py scripts/download_weights.py scripts/make_brand_assets.py
      - name: Tests
        # API tests are skipped without the model weights, dataset-dependent tests without the images.
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build (without downloading weights)
        run: docker build --build-arg DOWNLOAD_WEIGHTS=0 -t tomato-care:ci .
